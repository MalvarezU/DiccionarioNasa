# Postgres efímero SOLO para E2E local. Nunca apuntar a prod aquí.
services:
  e2e-db:
    image: postgres:16-alpine
    container_name: piiyaak-test-db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: piiyaak_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d piiyaak_test"]
      interval: 2s
      timeout: 3s
      retries: 30
