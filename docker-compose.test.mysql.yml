# MariaDB efímera SOLO para E2E local (rama feat/mysql). Nunca apuntar a prod aquí.
# Paridad con el hosting: Hostinger Web/Cloud usa MariaDB (cPanel default 10.11).
services:
  e2e-db-mariadb:
    image: mariadb:10.11
    container_name: piiyaak-test-db-mariadb
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: test
      MARIADB_DATABASE: piiyaak_test
      MARIADB_USER: test
      MARIADB_PASSWORD: test
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60
